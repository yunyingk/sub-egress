services:
  sub-egress:
    image: ghcr.io/yunyingk/sub-egress:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sub-egress
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATA_DIR=/data
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-}
      - SECRET_KEY=${SECRET_KEY:?Set a private random SECRET_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-}
      # Uncomment DATABASE_URL to connect to external PostgreSQL or bundled postgres service:
      # - DATABASE_URL=postgresql+asyncpg://dev:password@postgres:5432/sub_egress
    volumes:
      - sub_data:/data
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Optional bundled PostgreSQL 18 service
