# Configure the PostgreSQL connection using k8s/secret.example.yaml, or omit it to use SQLite.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub-egress
  namespace: infra
  labels:
    app: sub-egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sub-egress
  template:
    metadata:
      labels:
        app: sub-egress
    spec:
      containers:
        - name: app
          image: sub-egress:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sub-egress-session-secret
                  key: SECRET_KEY
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sub-egress-github-oauth
                  key: GITHUB_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sub-egress-github-oauth
                  key: GITHUB_CLIENT_SECRET
                  optional: true
            - name: GITHUB_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: sub-egress-github-oauth
                  key: GITHUB_REDIRECT_URI
                  optional: true
            - name: GITHUB_PROXY
              value: "http://10.42.1.1:7897"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sub-egress-secret
                  key: DATABASE_URL
                  optional: true
            - name: FRONTEND_DIR
              value: "/frontend"
            - name: DATA_DIR
              value: "/data"
            # Set WEBAUTHN_ORIGIN to the browser's exact HTTPS origin before enabling passkeys.
            - name: WEBAUTHN_ORIGIN
              value: "https://sub.ying-qing.cn"
          volumeMounts:
            - name: data-volume
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sub-egress
  namespace: infra
  labels:
    app: sub-egress
spec:
  type: NodePort
  selector:
    app: sub-egress
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30088
