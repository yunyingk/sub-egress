apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub-egress
  namespace: infra
  labels:
    app: sub-egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sub-egress
  template:
    metadata:
      labels:
        app: sub-egress
    spec:
      containers:
        - name: app
          image: sub-egress:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://dev:0317b6aca410fc390d59ee3a7eb220903c7f33f5aec71574@shared-postgres18.infra.svc.cluster.local:5432/sub_egress"
            - name: FRONTEND_DIR
              value: "/frontend"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sub-egress
  namespace: infra
  labels:
    app: sub-egress
spec:
  type: NodePort
  selector:
    app: sub-egress
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30088
