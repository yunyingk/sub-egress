name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.12
          uv sync --locked --extra dev

      - name: Run Ruff Lint
        run: |
          uv run --locked --extra dev ruff check backend/app backend/tests

      - name: Validate Python Syntax
        run: |
          uv run --locked --extra dev python -m py_compile backend/app/main.py backend/app/api.py backend/app/builder.py

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: uv run --locked --extra dev python -m pytest backend/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
