<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sub-egress · 出站网关与订阅调度中枢</title>
  <meta property="og:site_name" content="订阅调度 · sub-egress">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="alternate icon" href="/favicon.ico">
  <script src="/qrcode.min.js"></script>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <script>
    // 立即初始化外观 (浅色 / 深色 / 跟随系统)，避免页面闪烁
    (function() {
      try {
        const savedMode = localStorage.getItem('sub_egress_theme_mode') || localStorage.getItem('sub_egress_theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedMode === 'dark' || (savedMode === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();

    // 强制注销历史遗留的 Sub-Store PWA Service Worker 缓存
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let r of regs) { r.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) { caches.delete(name); }
      });
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="app"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
