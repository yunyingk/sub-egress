name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml pydantic fastapi

      - name: Run Ruff Lint
        run: |
          ruff check backend/app

      - name: Validate Python Syntax
        run: |
          python -m py_compile backend/app/main.py backend/app/api.py backend/app/builder.py
